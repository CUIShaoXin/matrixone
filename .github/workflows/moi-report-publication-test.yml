name: MOI accepted report MinIO publication
on:
  push:
    branches: [matrix-report-link-v1]
    paths:
      - .github/scripts/moi-report-link/cloud_publish.py
      - .github/scripts/moi-report-link/render_report.mjs
      - .github/workflows/moi-report-publication-test.yml
permissions:
  contents: read
concurrency:
  group: moi-report-publication-test
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/moi-report-link
      - name: Install report renderer
        run: npm install --prefix /tmp/matrix-report-renderer --ignore-scripts --no-audit --no-fund marked@17.0.5
      - name: Verify accepted MOI report and publish to MinIO
        env:
          MOI_API_KEY: ${{ secrets.MOI_API_KEY }}
          MATRIX_ACCEPTANCE_FILE_ID: 79c2f249-f1c5-4a7c-8d84-b94976fe5209
          MATRIX_ACCEPTANCE_SHA256: 986a29aca4c9516af379167a7f00c2d446d3741ca24aa90958c85641bd998957
          MATRIX_HISTORICAL_PUBLICATION_TEST: 'true'
          MATRIX_NODE_MODULES: /tmp/matrix-report-renderer/node_modules
        run: python3 .github/scripts/moi-report-link/cloud_publish.py
      - name: Retain publication status without reports or links
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moi-cloud-report-publication-${{ github.run_id }}
          path: out/moi-cloud-report-publication-receipt.json
          retention-days: 7
