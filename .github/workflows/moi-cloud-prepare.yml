name: MOI Cloud Scan Preparation
run-name: MOI cloud preparation (${{ inputs.report_date || 'today' }})

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Today in Asia/Shanghai (YYYY-MM-DD); empty means today'
        required: false
        type: string
  schedule:
    # 07:30 Asia/Shanghai; enabled only after the cloud acceptance run passes.
    - cron: '30 23 * * *'

permissions:
  contents: read

concurrency:
  group: moi-cloud-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || vars.MOI_CLOUD_PREP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      report_date: ${{ steps.archive.outputs.report_date }}
      handoff_file_id: ${{ steps.archive.outputs.handoff_file_id }}
    steps:
      - name: Check out trusted preparation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/moi-preview
            .github/scripts/moi-scan
      - name: Verify cloud preparation boundaries
        run: python3 -m unittest discover -s .github/scripts/moi-preview -p 'test_*.py'
      - name: Verify repository uploads and MOI archive
        id: archive
        env:
          MOI_API_KEY: ${{ secrets.MOI_API_KEY }}
          REPORT_DATE: ${{ inputs.report_date }}
          WAIT_FOR_CLOUD_RUNS: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: python3 .github/scripts/moi-preview/moi_cloud_prepare.py
      - name: Retain receipt without private scan data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moi-cloud-prepare-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/moi-cloud-prepare-receipt.json
          if-no-files-found: warn
          retention-days: 7
  assistant-preview:
    needs: prepare
    uses: ./.github/workflows/moi-archive-preview.yml
    with:
      report_date: ${{ needs.prepare.outputs.report_date }}
      handoff_file_id: ${{ needs.prepare.outputs.handoff_file_id }}
    secrets:
      MOI_API_KEY: ${{ secrets.MOI_API_KEY }}
