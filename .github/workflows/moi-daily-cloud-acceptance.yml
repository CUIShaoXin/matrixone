name: MOI Matrix security daily
run-name: MOI security ${{ inputs.mode || github.event.schedule }} - ${{ inputs.resume_run_id || 'daily batch' }}
on:
  schedule:
    # UTC: Asia/Shanghai 04:17 starts one same-batch run. The delivery job
    # waits for 10:00 after scan completion, so it does not depend on a
    # second scheduled event being created by GitHub.
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Full pipeline, read-only preview, or authorized once-per-day delivery
        type: choice
        options: [full, archives, reviews, preview, deliver, maintenance]
        default: full
      runtime_ref:
        description: Reviewed immutable runtime revision
        required: true
        default: 602eb813236a258c963eec5e1c7f2ce597eda41a
      resume_run_id:
        description: Same-day checkpoint only; blank starts the daily batch on schedule
        required: false
permissions:
  contents: read
jobs:
  scan:
    if: github.event_name == 'schedule' && github.event.schedule == '17 20 * * *' || github.event_name == 'workflow_dispatch' && inputs.mode != 'deliver' && inputs.mode != 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    concurrency:
      group: moi-matrix-daily-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.runtime_ref || '602eb813236a258c963eec5e1c7f2ce597eda41a' }}
          persist-credentials: false
          sparse-checkout: .github/scripts/moi-report-link
      - name: Record actual runtime revision
        run: echo "MATRIX_RUNTIME_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Ensure source inventory tool
        run: command -v rg || (sudo apt-get update -qq && sudo apt-get install -y ripgrep)
      - name: Check recovery and delivery gates
        working-directory: .github/scripts/moi-report-link
        run: python3 -m unittest -v test_pipeline_recovery test_api_port_review test_component_details test_unified_pipeline test_daily_delivery
      - name: Scan and publish today's three repositories
        id: scan
        continue-on-error: true
        env:
          MOI_API_KEY: ${{ secrets.MOI_API_KEY }}
          SCAN_GITHUB_TOKEN: ${{ secrets.SCAN_GITHUB_TOKEN }}
          MATRIX_PIPELINE_MODE: ${{ inputs.mode || 'full' }}
          MATRIX_PIPELINE_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          MATRIX_SCHEDULED_BATCH: ${{ github.event_name == 'schedule' }}
        run: python3 .github/scripts/moi-report-link/daily_pipeline.py
      - name: One bounded recovery of the exact same batch
        if: steps.scan.outcome == 'failure'
        env:
          MOI_API_KEY: ${{ secrets.MOI_API_KEY }}
          SCAN_GITHUB_TOKEN: ${{ secrets.SCAN_GITHUB_TOKEN }}
          MATRIX_PIPELINE_MODE: ${{ inputs.mode || 'full' }}
          MATRIX_PIPELINE_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          MATRIX_SCHEDULED_BATCH: ${{ github.event_name == 'schedule' }}
        run: python3 .github/scripts/moi-report-link/daily_pipeline.py
      - name: Retain safe timings and status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moi-security-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/pipeline/status.json
            out/pipeline-events.jsonl
          retention-days: 14
  deliver:
    needs: scan
    if: always() && (github.event_name == 'schedule' && github.event.schedule == '17 20 * * *' || github.event_name == 'workflow_dispatch' && (inputs.mode == 'deliver' || inputs.mode == 'preview'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: moi-matrix-daily-deliver
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.runtime_ref || '602eb813236a258c963eec5e1c7f2ce597eda41a' }}
          persist-credentials: false
          sparse-checkout: .github/scripts/moi-report-link
      - name: Record actual runtime revision
        run: echo "MATRIX_RUNTIME_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Wait until 10:00 Beijing for the scheduled same-batch delivery
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import datetime as dt
          import time
          tz = dt.timezone(dt.timedelta(hours=8))
          while dt.datetime.now(tz).hour < 10:
              time.sleep(15)
          PY
      - name: Verify today's report and deliver once to existing group
        env:
          MOI_API_KEY: ${{ secrets.MOI_API_KEY }}
          MATRIX_DELIVERY_PREVIEW: ${{ inputs.mode == 'preview' }}
        run: python3 .github/scripts/moi-report-link/daily_delivery.py
      - name: Retain safe delivery status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moi-security-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/delivery/status.json
            out/pipeline-events.jsonl
          retention-days: 14
