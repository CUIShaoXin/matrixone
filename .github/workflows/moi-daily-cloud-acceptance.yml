name: MOI Matrix security daily
run-name: MOI security ${{ inputs.mode || github.event.schedule }} - ${{ inputs.resume_run_id || 'daily batch' }}
on:
  schedule:
    # Beijing 00:17 prepares the new day's fixed-commit report.
    # Beijing 04:17 starts a separate delivery runner early, avoiding a new
    # GitHub scheduling decision at 10:00. It verifies at 09:50, then waits
    # until 10:00 before any send. Both phases share the same daily identity.
    - cron: '17 16 * * *'
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Full pipeline, read-only preview, or authorized once-per-day delivery
        type: choice
        options: [full, archives, reviews, preview, deliver, maintenance]
        default: full
      runtime_ref:
        description: Reviewed immutable runtime revision
        required: true
        default: c9cd57818f76506fdbaf517dae24431091671501
      resume_run_id:
        description: Same-day checkpoint only; blank starts the daily batch on schedule
        required: false
permissions:
  contents: read
jobs:
  scan:
    if: github.event_name == 'schedule' && github.event.schedule == '17 16 * * *' || github.event_name == 'workflow_dispatch' && inputs.mode != 'deliver' && inputs.mode != 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    concurrency:
      group: moi-matrix-daily-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.runtime_ref || 'c9cd57818f76506fdbaf517dae24431091671501' }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/moi-report-link
            .github/workflows/moi-daily-cloud-acceptance.yml
      - name: Record actual runtime revision
        run: echo "MATRIX_RUNTIME_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Ensure source inventory tool
        run: command -v rg || (sudo apt-get update -qq && sudo apt-get install -y ripgrep)
      - name: Check recovery and delivery gates
        working-directory: .github/scripts/moi-report-link
        run: python3 -m unittest discover -v -p 'test_*.py'
      - name: Scan and publish today's three repositories
        env:
          MOI_API_KEY: ${{ secrets.MOI_API_KEY }}
          SCAN_GITHUB_TOKEN: ${{ secrets.SCAN_GITHUB_TOKEN }}
          MATRIX_PIPELINE_MODE: ${{ inputs.mode || 'full' }}
          MATRIX_PIPELINE_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          MATRIX_SCHEDULED_BATCH: ${{ github.event_name == 'schedule' }}
        run: python3 .github/scripts/moi-report-link/daily_supervisor.py scan ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      - name: Retain safe timings and status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moi-security-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/pipeline/status.json
            out/pipeline-events.jsonl
            out/supervisor/scan-*.json
          retention-days: 14
  deliver:
    needs: scan
    if: always() && (github.event_name == 'schedule' && github.event.schedule == '17 20 * * *' || github.event_name == 'workflow_dispatch' && (inputs.mode == 'deliver' || inputs.mode == 'preview'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: moi-matrix-daily-deliver
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.runtime_ref || 'c9cd57818f76506fdbaf517dae24431091671501' }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/moi-report-link
            .github/workflows/moi-daily-cloud-acceptance.yml
      - name: Record actual runtime revision
        run: echo "MATRIX_RUNTIME_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check bounded receipt recovery and time barriers
        working-directory: .github/scripts/moi-report-link
        run: python3 -m unittest -v test_daily_delivery test_daily_supervisor test_delivery_recovery test_storage_recovery
      - name: Verify today's report and deliver once to existing group
        env:
          MOI_API_KEY: ${{ secrets.MOI_API_KEY }}
          MATRIX_DELIVERY_PREVIEW: ${{ inputs.mode == 'preview' }}
        run: python3 .github/scripts/moi-report-link/daily_supervisor.py deliver ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      - name: Retain safe delivery status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moi-security-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/delivery/status.json
            out/pipeline-events.jsonl
            out/supervisor/deliver-*.json
          retention-days: 14
